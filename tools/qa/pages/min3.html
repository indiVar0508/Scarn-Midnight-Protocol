<!doctype html><html><body style="margin:0;background:#000"><div id="g"></div>
<script type="module">
import Phaser from '/node_modules/.vite/deps/phaser.js';
const q = new URLSearchParams(location.search);
const N = +(q.get('n') || 0), S = +(q.get('s') || 256);
class S1 extends Phaser.Scene { create() {
  for (let i = 0; i < N; i++) { const c = document.createElement('canvas'); c.width = S; c.height = S; const g = c.getContext('2d'); g.fillStyle = '#' + ((Math.random()*0xffffff)|0).toString(16).padStart(6,'0'); g.fillRect(0,0,S,S); this.textures.addCanvas('t' + i, c); }
  const show = +(q.get('show') || 0);
  for (let i = 0; i < show; i++) this.add.image(Math.random()*1280, Math.random()*720, 't' + (i % N)).setScale(0.2);
} }
window.game = new Phaser.Game({ type: Phaser.WEBGL, parent: 'g', width: 1280, height: 720, scene: S1, banner: false, audio: { noAudio: true } });
</script></body></html>
