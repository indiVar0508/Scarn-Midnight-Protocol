<!doctype html><html><body style="margin:0;background:#000"><div id="g" style="width:1280px;height:720px"></div>
<script type="module">
import Phaser from '/node_modules/.vite/deps/phaser.js';
const q = new URLSearchParams(location.search);
class S extends Phaser.Scene { create() { const g = this.add.graphics(); g.fillStyle(0xff0000).fillRect(0,0,1280,720); for (let i=0;i<40;i++) this.add.rectangle(Math.random()*1280, Math.random()*720, 60, 60, 0x00ff00); } }
const cfg = { type: Phaser.WEBGL, parent: 'g', width: 1280, height: 720, scene: S, banner: false, audio: { noAudio: true } };
if (q.get('scale')) cfg.scale = { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1280, height: 720 };
if (q.get('render')) cfg.render = { antialias: true, pixelArt: false, roundPixels: false, powerPreference: 'high-performance' };
if (q.get('fps')) cfg.fps = { target: 60, smoothStep: true };
if (q.get('input')) cfg.input = { keyboard: false, mouse: true, touch: true, gamepad: false };
window.game = new Phaser.Game(cfg);
</script></body></html>
