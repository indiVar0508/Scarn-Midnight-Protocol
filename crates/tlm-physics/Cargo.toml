[package]
name = "tlm-physics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Threat Level Midnight physics: the rapier3d crate (dimforge/rapier) compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rapier from dimforge/rapier (crates.io release of the same repository).
rapier3d = "0.36"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
